<app-heading-box [heading]="heading" [style]="style" (headClick)="resiveMsg($event)"></app-heading-box>

<div class="grid grid-cols-3 gap-8">
    @for(items of products; track $index){
    <div class="flex flex-col items-center border rounded-2xl" track>
        <img src="{{items.thumbnail}}" alt="{{items.title}}-img" class="w-full h-50 object-contain">
        <h3>{{items.title}}</h3>
        <button (click)="viewProduct(items.id)">View Product</button>
    </div>
    }
</div>

<ul>
@for(item of obj; track $index){
    <li>{{item.id}}</li>
    <li>{{item.name}}</li>
    <li>{{item.price}}</li>
}
</ul>
